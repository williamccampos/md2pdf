<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD → PDF</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
h1 { font-size: 1.4em; font-weight: 600; background: linear-gradient(135deg, #4da15e, #30d158); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: calc(100vh - 120px); }
.panel { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; }
.panel h3 { font-size: 0.8em; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
textarea { flex: 1; background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; color: #e0e0e0; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.85em; resize: none; outline: none; line-height: 1.5; }
textarea:focus { border-color: #4da15e; }
#preview { flex: 1; overflow-y: auto; padding: 20px; background: #fff; border-radius: 8px; color: #1a1a1a; font-size: 0.85em; line-height: 1.6; }
#preview h1 { color: #1a1a1a; border-bottom: 2px solid #4da15e; padding-bottom: 6px; margin-bottom: 12px; font-size: 1.4em; }
#preview h2 { color: #2d5a3a; margin-top: 20px; margin-bottom: 8px; font-size: 1.1em; }
#preview h3 { color: #333; margin-top: 16px; margin-bottom: 6px; font-size: 1em; }
#preview table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 0.9em; }
#preview th, #preview td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; }
#preview th { background: #4da15e; color: white; }
#preview tr:nth-child(even) { background: #f5f5f5; }
#preview ul, #preview ol { padding-left: 20px; margin: 8px 0; }
#preview li { margin-bottom: 4px; }
#preview hr { border: none; border-top: 1px solid #e0e0e0; margin: 16px 0; }
#preview code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
#preview pre { background: #f5f5f5; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 12px 0; }
#preview pre code { background: none; padding: 0; }
#preview strong { color: #111; }
#preview blockquote { border-left: 3px solid #4da15e; padding-left: 12px; color: #555; margin: 12px 0; }
.toolbar { display: flex; gap: 8px; align-items: center; }
.btn { padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.82em; transition: all 0.2s; }
.btn-primary { background: linear-gradient(135deg, #4da15e, #30d158); color: white; }
.btn-primary:hover { transform: scale(1.02); box-shadow: 0 4px 12px rgba(77,161,94,0.3); }
.btn-secondary { background: #2a2a2a; color: #ccc; border: 1px solid #444; }
.btn-secondary:hover { background: #333; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; height: auto; } .panel { min-height: 300px; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📄 MD → PDF</h1>
    <div class="toolbar">
      <button class="btn btn-secondary" onclick="loadFile()">📂 Abrir .md</button>
      <button class="btn btn-primary" onclick="exportPDF()">⬇ Salvar PDF</button>
      <input type="file" id="fileInput" accept=".md,.txt,.markdown" style="display:none" onchange="handleFile(event)">
    </div>
  </header>
  <div class="grid">
    <div class="panel">
      <h3>Markdown</h3>
      <textarea id="editor" placeholder="Cole ou digite seu Markdown aqui..."></textarea>
    </div>
    <div class="panel">
      <h3>Preview</h3>
      <div id="preview"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
let currentFilename = 'documento';

let debounce;
editor.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    preview.innerHTML = marked.parse(editor.value);
    autoTitle();
  }, 150);
});

function autoTitle() {
  const lines = editor.value.trim().split('\n');
  for (const line of lines) {
    const match = line.match(/^#+\s+(.+)/);
    if (match) {
      currentFilename = match[1].trim().toLowerCase().replace(/[^a-z0-9à-ú\s-]/gi, '').replace(/\s+/g, '-').slice(0, 60);
      return;
    }
    const text = line.trim();
    if (text && !text.startsWith('---')) {
      currentFilename = text.toLowerCase().replace(/[^a-z0-9à-ú\s-]/gi, '').replace(/\s+/g, '-').slice(0, 60);
      return;
    }
  }
}

function loadFile() { document.getElementById('fileInput').click(); }

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    editor.value = ev.target.result;
    preview.innerHTML = marked.parse(editor.value);
    currentFilename = file.name.replace(/\.(md|txt|markdown)$/, '');
    autoTitle();
  };
  reader.readAsText(file);
}

function exportPDF() {
  const content = preview.innerHTML;
  if (!content) return;

  const printWindow = window.open('', '_blank');
  printWindow.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${currentFilename}</title><style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; max-width: 700px; margin: 0 auto; padding: 40px; color: #1a1a1a; line-height: 1.6; font-size: 11pt; }
    h1 { color: #1a1a1a; border-bottom: 2px solid #4da15e; padding-bottom: 6px; margin-bottom: 16px; font-size: 18pt; }
    h2 { color: #2d5a3a; margin-top: 24px; margin-bottom: 8px; font-size: 14pt; }
    h3 { color: #333; margin-top: 16px; margin-bottom: 6px; font-size: 12pt; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 9pt; }
    th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
    th { background: #4da15e; color: white; }
    tr:nth-child(even) { background: #f5f5f5; }
    hr { border: none; border-top: 1px solid #ddd; margin: 20px 0; }
    code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 0.9em; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    ul, ol { padding-left: 20px; }
    li { margin-bottom: 3px; }
    strong { color: #111; }
    blockquote { border-left: 3px solid #4da15e; padding-left: 12px; color: #555; }
    @media print { body { padding: 20px; } }
  </style></head><body>${content}</body></html>`);
  printWindow.document.close();
  setTimeout(() => { printWindow.print(); }, 300);
}
</script>
</body>
</html>
